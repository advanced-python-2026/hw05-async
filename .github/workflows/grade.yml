name: Submit Assignment and Run Grader

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  grade:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - name: Check out submission
        uses: actions/checkout@v4
        with:
          path: submission
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Run grader
        uses: pawtograder/assignment-action@v4
        with:
          grading_server: https://api.pawtograder.sabal.pro
          action_ref: '${{ github.action_ref }}'
          action_repository: '${{ github.action_repository }}'
